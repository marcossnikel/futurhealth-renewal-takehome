name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal ./pkg)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Check workflow determinism
        run: go run go.temporal.io/sdk/contrib/tools/workflowcheck@v0.5.0 ./...
